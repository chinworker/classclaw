# Include in the public HTTPS server block (and the HTTP block before TLS is configured).
location ~ ^/downloads/classroom-mate/(latest|build-[1-9][0-9]*)/(release\.json|ClassroomMate-Setup-win-x64\.exe)$ {
    root /var/www;
    types { application/json json; application/octet-stream exe; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
