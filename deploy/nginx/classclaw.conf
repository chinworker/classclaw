# Install in /etc/nginx/sites-available/classclaw; replace class.example.com.
# Obtain HTTPS with certbot --nginx after testing this HTTP configuration.
server {
    listen 80;
    server_name class.example.com;
    server_tokens off;
    client_max_body_size 21m;
    client_body_timeout 60s;

    # The backend already writes bounded request metadata logs.
    access_log off;
    error_log /var/log/nginx/classclaw-error.log warn;

    location = / { return 302 /app/; }
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /app/test.html { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Deliver SSE immediately. Keep request buffering for slow uploads.
        proxy_buffering off;
        gzip off;
        proxy_cache off;
        proxy_request_buffering on;
        proxy_next_upstream off;
    }
}
