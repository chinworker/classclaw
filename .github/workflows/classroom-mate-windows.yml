name: Classroom Mate Windows x64

on:
  push:
    branches: ['**']
    paths:
      - 'classroom-mate/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: classroom-mate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Test terminal protocol
        run: dotnet run --project tests/ClassroomMate.Tests -c Release
      - name: Build self-contained installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          python scripts/package.py --iscc $iscc
      - name: Verify Windows install, upgrade and uninstall
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'ClassroomMate-0.2.1-Setup.exe'
          $url = 'https://github.com/chinworker/classclaw/releases/download/classroom-mate-build-5/ClassroomMate-Setup-win-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous).Hash -ne '046816502335a64438187b2b553b1099e5f20be6ff2fb0042dc49dcd80990633') {
            throw 'The published upgrade baseline has an unexpected SHA-256.'
          }
          ./tests/installer-smoke.ps1 -PreviousSetup $previous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ClassroomMate-Setup-win-x64
          path: |
            classroom-mate/dist/ClassroomMate-Setup-win-x64.exe
            classroom-mate/dist/ClassroomMate-Setup-win-x64.exe.sha256
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ClassroomMate-Setup-win-x64
      - name: Publish Windows installer to GitHub Releases
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          installer=ClassroomMate-Setup-win-x64.exe
          sha256sum --check "$installer.sha256"
          tag="classroom-mate-build-$GITHUB_RUN_NUMBER"
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" == 'true' ]]; then
              gh release upload "$tag" "$installer" "$installer.sha256" --clobber
              gh release edit "$tag" --draft=false
            fi
          else
            gh release create "$tag" "$installer" "$installer.sha256" \
              --target "$GITHUB_SHA" \
              --title "Classroom Mate Windows x64 · Build $GITHUB_RUN_NUMBER" \
              --notes "Windows x64 安装程序，适用于当前用户安装。源代码提交：$GITHUB_SHA。构建与安装验证：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          gh release view "$tag" --json url --jq '.url'
