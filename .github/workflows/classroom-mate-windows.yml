name: Classroom Mate Windows x64

on:
  push:
    paths:
      - 'classroom-mate/**'
      - '.github/workflows/classroom-mate-windows.yml'
      - 'docs/windows-client-agent-prompt.md'
      - 'docs/classroom-monitoring.md'
      - 'docs/classroom-media-deployment.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: classroom-mate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Test terminal protocol
        run: dotnet run --project tests/ClassroomMate.Tests -c Release
      - name: Build self-contained installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          python scripts/package.py --iscc $iscc
      - name: Verify Windows install, upgrade and uninstall
        run: ./tests/installer-smoke.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ClassroomMate-Setup-win-x64
          path: |
            classroom-mate/dist/ClassroomMate-Setup-win-x64.exe
            classroom-mate/dist/ClassroomMate-Setup-win-x64.exe.sha256
          compression-level: 0
          if-no-files-found: error
